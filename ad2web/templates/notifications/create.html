{% extends 'settings/layout.html' %}
{% block body %}
<form id="create-form" method="POST" action="{{ url_for('notifications.create') }}">
    {{ form.hidden_tag() }}
    <div class="form-group">
        {{ form.type.label }} {{ form.type(class="form-control") }}
    </div>
    <div class="form-group">
        {{ form.submit(class="btn btn-primary") }}
        {{ form.cancel(class="btn btn-secondary") }}
    </div>
</form>
{% endblock %}
