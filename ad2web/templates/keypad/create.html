{% from "macros/_form.html" import render_form %}
{% extends 'settings/layout.html' %}

{% block css %}{% endblock %}

{% block pagejs %}
<script type="text/javascript">
    $(document).ready(function() {
        // Provide tooltips for form fields
        createFormTooltip('#text', 'The text to display on the custom button.');
        createFormTooltip('#code', 'The alarm keypad keys or sequence to send when this button is pressed.');
    });
</script>
{% endblock %}

{% block body %}
<div class="settings_wrapper">
    {{ render_form(url_for('keypad.create_button'), form) }}
</div>
{% endblock %}
