# .aider.conf.yml  (root of your Git repo)

# 1) The LLM you want—and only this model flag is supported:
model: vertex_ai/gemini-2.5-pro-preview-03-25

# 2) Export your Vertex AI project + region for litellm to pick up:
set-env:
  - VERTEX_PROJECT=alarmdecoder-refactor
  - VERTEX_LOCATION=us-central1

# 3) (Optional) Inject your Gemini API key from your .env:
#api-key:
#  - gemini=${GEMINI_API_KEY}

# 4) Chain‑of‑thought tuning:
#reasoning-effort: high
#thinking-tokens: 8k

# 5) Architect/editor split:
architect: true
weak-model: gemini-2.5-pro-preview-03-25
editor-model: gemini-2.5-pro-preview-03-25
auto-accept-architect: false
